models: ["opus", "sonnet", "haiku", "fable", "opus-4-8"]
defaults: ["all:*"]
when:
  - "model sonnet": ["agent-delegation@sonnet"]
  - "model haiku":
      [
        "agent-delegation@haiku",
        "-asking-questions",
        "-claims",
        "-data-modeling",
        "-debugging",
        "-handoff",
        "-inquiring",
        "-persistent-memory",
        "-reasoning-guidelines",
        "-repairing",
        "-worktrees",
        "-writing-code",
        "writing-prose@haiku",
      ]
  - "agent eval-runner": ["-writing-prose"]
