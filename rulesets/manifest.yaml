# Each tier's composition is exactly what its own entry states.
#
# A tier takes one of two forms and never both. `include: "*"` with an
# optional `exclude` list means every stem under `default/` less the
# exclusions. `include:` followed by a list of stems states the set
# outright and carries no `exclude`.
#
# The five family tier keys are required. A missing key is an illegal state,
# so a family tier cannot appear by accident.
#
# A key beyond those five names one model, and its name is the model
# identifier. `tier_lookup` matches such a key ahead of the family, so the
# model needs no entry in `models.yaml`. Adding one means adding the
# directory and the key here, with no code change.
tiers:
  default:
    include: "*"
  fable:
    include: "*"
  opus:
    include: "*"
  # sonnet and haiku never spawn, so both leave out the rules on delegation
  # and the spawn decision. haiku runs as a subagent handed reads, maps,
  # summaries, and stated changes, without AskUserQuestion, so it leaves out
  # the rules for other work and for that tool. haiku reads its own body for
  # the rule on prose, `haiku/writing-prose.md`.
  sonnet:
    include: "*"
    exclude:
      - agent-delegation
      - spawn-decision
  haiku:
    include: "*"
    exclude:
      - agent-delegation
      - spawn-decision
      - asking-questions
      - persistent-memory
      - worktrees
      - writing-code
      - writing-comments
      - data-modeling
      - debugging
      - repairing
      - claims
      - reasoning-guidelines
      - inquiring
  claude-opus-4-8:
    include: "*"

# The sequence a reader meets these rules in, which the renders follow. It is
# this corpus's own: nothing in the plugin's code names a stem, and a corpus
# stating no order renders its stems sorted instead.
#
# Delivery and the renders both follow this list. Adding an always-on body
# adds its stem here in the same change, and `check` reports an
# `order-mismatch` where the two disagree.
order:
  - core-rules
  - marked-messages
  - sorting
  - resolving-input
  - verifying
  - tracked-tasks
  - breaks
  - user-approval
  - concerns
  - reporting
  - reasoning-guidelines
  - inquiring
  - ask-user-before-assuming
  - asking-questions
  - scope-is-user-decision
  - claims
  - writing-prose
  - writing-comments
  - unasked-asides
  - writing-code
  - data-modeling
  - repairing
  - debugging
  - search-tools
  - reading-docs
  - structural-search
  - never-use-sed
  - shell-quoting
  - waiting-on-processes
  - git-commit
  - worktrees
  - spawn-decision
  - agent-delegation
  - delegate-report
  - writing-plans
  - scratchpad
  - persistent-memory
