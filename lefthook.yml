pre-commit:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: markdownlint
            glob: "*.md"
            run: bunx markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: ruff
            glob: "*.py"
            run: ruff check --fix {staged_files} && ruff format {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -w {staged_files}
            stage_fixed: true
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {staged_files}

    # Sequential, outside the group above: this and markdownlint both rewrite
    # the same .md files, and lefthook runs top-level jobs one after another
    # while a group with parallel: true runs its own jobs at once.
    # https://github.com/evilmartians/lefthook/blob/master/docs/configuration/parallel.md
    # The script formats the rules files and CLAUDE.md and passes over every
    # other path it is handed, so the glob here only keeps the job quiet.
    - name: format-rules-xml
      glob: "*.md"
      run: python3.14 scripts/format-rules-xml.py {staged_files}
      stage_fixed: true

# pre-push gate: re-runs the check-only side of every linter against the
# diff being pushed, and regenerates the agent configs. shellcheck and
# shfmt -d have no autofix; ruff check without --fix matches the same
# intent. Catches anything that slipped in via --no-verify or commits made
# before lefthook install.
pre-push:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: ruff-check
            glob: "*.py"
            run: ruff check {push_files}
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {push_files}
          - name: shfmt-check
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -d {push_files}
          - name: format-rules-xml-check
            glob: "*.md"
            run: python3.14 scripts/format-rules-xml.py --check {push_files}

    # Ungated by glob: a generated file also goes stale when a plugin is
    # enabled or disabled, which changes no file under version control.
    # The three translation jobs run forward, since the 22 outputs they
    # write live outside this repository and land on push and nowhere else.
    # The four jobs that write a generated file then run their check mode,
    # so a write that half happened reports rather than passing unseen. The
    # render stays check-only: a push carrying a render its own sources no
    # longer produce is what this gate exists to refuse. The job that splits
    # the render back into CLAUDE.md and the rules files stays out, since
    # those are hand-edited sources and naming one as differing from a
    # render would make the derived artifact the one to match. Gated to main
    # because the outputs outside this repository are the live configs,
    # which a branch's unfinished rules should not overwrite. lefthook runs
    # a job through sh, per
    # https://github.com/evilmartians/lefthook/blob/master/docs/configuration/run.md,
    # which takes its status from the last line, so set -e is what carries a
    # nonzero exit from any one of these out to the gate.
    - name: sync-agent-configs
      only:
        - ref: main
      run: |
        set -e
        python3.14 scripts/agent-configs/translate-for-pi.py
        python3.14 scripts/agent-configs/translate-for-opencode.py
        python3.14 scripts/agent-configs/own-opencode-key.py
        python3.14 scripts/agent-configs/translate-for-pi.py --check
        python3.14 scripts/agent-configs/translate-for-opencode.py --check
        python3.14 scripts/agent-configs/own-opencode-key.py --check
        python3.14 scripts/agent-configs/render-working-rules.py --check || {
          echo "references/working-rules.md no longer matches its sources."
          echo "Run python3.14 scripts/agent-configs/render-working-rules.py,"
          echo "commit the render it writes, then push again."
          exit 1
        }
