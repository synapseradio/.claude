pre-commit:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: markdownlint
            glob: "*.md"
            run: bunx markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: ruff
            glob: "*.py"
            run: ruff check --fix {staged_files} && ruff format {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -w {staged_files}
            stage_fixed: true
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {staged_files}

    - name: render-rulesets
      glob:
        - "rulesets/config.yaml"
        - "rulesets/rules/**"
      run: >-
        python3.14 features/plugins/rulesets/lib/rulesets/cli.py render --root rulesets
        && git add rulesets/-render

pre-push:
  jobs:
    - name: shellcheck
      glob: "*.{sh,bash}"
      run: shellcheck {push_files}

    # Ungated by glob: enabling a plugin stales a generated file while
    # changing nothing under version control. The translation jobs write the
    # live configs outside this repository, so they run on main alone, then
    # check what they wrote. The pool check only reads. set -e carries a
    # failure out to the gate, which reads the last line's status.
    # https://github.com/evilmartians/lefthook/blob/master/docs/configuration/run.md
    - name: sync-agent-configs
      only:
        - ref: main
      run: |
        set -e
        python3.14 scripts/agent-configs/translate-for-pi.py
        python3.14 scripts/agent-configs/translate-for-opencode.py
        python3.14 scripts/agent-configs/own-opencode-key.py
        python3.14 scripts/agent-configs/translate-for-pi.py --check
        python3.14 scripts/agent-configs/translate-for-opencode.py --check
        python3.14 scripts/agent-configs/own-opencode-key.py --check
        python3.14 features/plugins/rulesets/lib/rulesets/cli.py check --root rulesets
