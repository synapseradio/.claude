pre-commit:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: markdownlint
            glob: "*.md"
            run: bunx markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: ruff
            glob: "*.py"
            run: ruff check --fix {staged_files} && ruff format {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -w {staged_files}
            stage_fixed: true
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {staged_files}

# Re-runs each linter's check-only side against the diff being pushed, and
# regenerates the agent configs. Catches whatever skipped the commit hook.
pre-push:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: ruff-check
            glob: "*.py"
            run: ruff check {push_files}
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {push_files}
          - name: shfmt-check
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -d {push_files}

    # Ungated by glob: enabling a plugin stales a generated file while
    # changing nothing under version control. The translation jobs write the
    # live configs outside this repository, so they run on main alone, then
    # check what they wrote. The render only checks, and the reverse
    # direction stays out: its targets are hand-edited. set -e carries a
    # failure out to the gate, which reads the last line's status.
    # https://github.com/evilmartians/lefthook/blob/master/docs/configuration/run.md
    - name: sync-agent-configs
      only:
        - ref: main
      run: |
        set -e
        python3.14 scripts/agent-configs/translate-for-pi.py
        python3.14 scripts/agent-configs/translate-for-opencode.py
        python3.14 scripts/agent-configs/own-opencode-key.py
        python3.14 scripts/agent-configs/translate-for-pi.py --check
        python3.14 scripts/agent-configs/translate-for-opencode.py --check
        python3.14 scripts/agent-configs/own-opencode-key.py --check
        python3.14 scripts/agent-configs/render-working-rules.py --check || {
          echo "A reference file under references/ no longer matches its model's bodies."
          echo "The check named each one above."
          echo "Run python3.14 scripts/agent-configs/render-working-rules.py,"
          echo "commit the renders it writes, then push again."
          exit 1
        }
