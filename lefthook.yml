---
# Each job calls a just recipe. The commands, the suites, and the source
# globs that select them live in the justfile and scripts/verify/jobs.toml.
pre-commit:
  jobs:
    - name: verify
      group:
        parallel: false
        jobs:
          # fmt and lint stage their fixes even when findings remain, then
          # exit with the recipe's status. stage_fixed stages only after a
          # zero exit:
          # https://github.com/evilmartians/lefthook/blob/v2.2.2/internal/run/controller/job.go#L146-L154
          # Lefthook hides the unstaged hunks of partially staged files
          # around the hook, so the git add takes only staged work:
          # https://github.com/evilmartians/lefthook/blob/v2.2.2/internal/run/controller/controller.go#L97
          - name: fmt
            run: just fmt {staged_files}; code=$?; git add -- {staged_files}; exit $code

          - name: lint
            run: just lint {staged_files}; code=$?; git add -- {staged_files}; exit $code

          - name: render-rulesets
            glob:
              - "rulesets/config.yaml"
              - "rulesets/rules/**"
            run: just render && git add rulesets/-render

          # A staged test file runs alone; the mod runner takes only a
          # folder, so a staged context-gauge test runs that whole suite.
          - name: changed-tests
            glob:
              - "features/plugins/rulesets/tests/test_*.py"
              - "features/plugins/epistemic-marks/tests/test_*.py"
              - "scripts/tests/test_*.py"
              - "scripts/hooks/test_*.py"
              - "features/plugins/warden/tests/*.bats"
              - "features/plugins/harness-config/tests/*.bats"
              - "scripts/setup/tests/*.bats"
              - "scripts/render/tests/*.bats"
              - "features/mods/context-gauge/tests/*.test.{ts,tsx}"
            run: just test {staged_files}

# A push runs the linters and the suites its commits touch.
pre-push:
  jobs:
    - name: verify
      group:
        parallel: true
        jobs:
          - name: lint
            run: just lint --prepush
          - name: test
            run: just test --prepush
