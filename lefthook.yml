pre-commit:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: markdownlint
            glob: "*.md"
            run: bunx markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: ruff
            glob: "*.py"
            run: ruff check --fix {staged_files} && ruff format {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -w {staged_files}
            stage_fixed: true
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {staged_files}

    # Sequential, outside the group above: this and markdownlint both rewrite
    # the same .md files, and lefthook runs top-level jobs one after another
    # while a group with parallel: true runs its own jobs at once.
    # https://github.com/evilmartians/lefthook/blob/master/docs/configuration/parallel.md
    # The script formats the rules files and CLAUDE.md and passes over every
    # other path it is handed, so the glob here only keeps the job quiet.
    - name: format-rules-xml
      glob: "*.md"
      run: python3.14 scripts/format-rules-xml.py {staged_files}
      stage_fixed: true

# pre-push gate: re-runs the check-only side of every linter against the
# diff being pushed, and regenerates the agent configs. shellcheck and
# shfmt -d have no autofix; ruff check without --fix matches the same
# intent. Catches anything that slipped in via --no-verify or commits made
# before lefthook install.
pre-push:
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - name: ruff-check
            glob: "*.py"
            run: ruff check {push_files}
          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {push_files}
          - name: shfmt-check
            glob: "*.{sh,bash}"
            run: shfmt -i 2 -d {push_files}
          - name: format-rules-xml-check
            glob: "*.md"
            run: python3.14 scripts/format-rules-xml.py --check {push_files}

    # Ungated by glob: a generated file also goes stale when a plugin is
    # enabled or disabled, which changes no file under version control.
    # This writes the outputs, so the 22 that live outside this repository
    # land without a second command. The one output tracked here is the
    # exception: a push carrying a render its own sources no longer produce
    # is what this gate exists to stop, so a change to that file ends the
    # push with the regeneration already done. Gated to main because the
    # outputs outside this repository are the live configs, which a branch's
    # unfinished rules should not overwrite. This is the only hook that runs
    # the generator: the script refuses to write over a render carrying
    # uncommitted changes, and a staged render is uncommitted, so the same
    # job at pre-commit blocks every commit that touches the rules.
    - name: sync-agent-configs
      only:
        - ref: main
      run: |
        python3.14 scripts/sync-agent-configs.py
        git diff --quiet -- references/working-rules.md || {
          echo "references/working-rules.md was stale and has been regenerated."
          echo "Commit it, then push again."
          exit 1
        }
