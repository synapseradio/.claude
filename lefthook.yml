---
pre-commit:
  jobs:
    - name: lint
      group:
        parallel: false
        jobs:
          - name: biome
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc}"
            run: node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: node_modules/.bin/markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: ruff
            glob: "*.py"
            run: uv run --frozen ruff check --fix {staged_files} && uv run --frozen ruff format {staged_files}
            stage_fixed: true
          - name: yaml
            glob: "*.{yaml,yml}"
            run: yamlfmt {staged_files} && uv run --frozen yamllint --strict {staged_files}
            stage_fixed: true
          - name: taplo
            glob: "*.toml"
            run: taplo fmt {staged_files} && taplo check {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.{sh,bash,bats}"
            run: shfmt -i 2 -w {staged_files}
            stage_fixed: true
          - name: shellcheck
            glob: "*.{sh,bash,bats}"
            run: shellcheck {staged_files}

    # tsc refuses file arguments beside a tsconfig.json, so it checks the
    # whole project.
    # https://github.com/microsoft/TypeScript/blob/main/tsc/internal/execute/tsc.go
    - name: tsc-context-gauge
      root: features/mods/context-gauge/
      glob: "*.{ts,tsx,mts,cts}"
      run: ../../../node_modules/.bin/tsc -p .

    # The engine's own static check of a plugin: everything it would refuse at
    # load fails the commit.
    # https://code.claude.com/docs/en/plugins-reference
    - name: plugin-validate
      group:
        parallel: true
        jobs:
          - name: context-gauge
            root: features/mods/context-gauge/
            glob: "*"
            run: claude plugin validate .
          - name: epistemic-marks
            root: features/plugins/epistemic-marks/
            glob: "*"
            run: claude plugin validate .
          - name: harness-config
            root: features/plugins/harness-config/
            glob: "*"
            run: claude plugin validate .
          - name: planning
            root: features/plugins/planning/
            glob: "*"
            run: claude plugin validate .
          - name: rulesets
            root: features/plugins/rulesets/
            glob: "*"
            run: claude plugin validate .
          - name: warden
            root: features/plugins/warden/
            glob: "*"
            run: claude plugin validate .
          - name: marketplace
            glob: ".claude-plugin/marketplace.json"
            run: claude plugin validate .

    - name: render-rulesets
      glob:
        - "rulesets/config.yaml"
        - "rulesets/rules/**"
      run: >-
        bash features/plugins/rulesets/hooks/with-python.sh features/plugins/rulesets/lib/rulesets/cli.py render --root rulesets && git add rulesets/-render

    # One job per suite, gated by the files its scope reads, so a commit runs
    # only the suites it touches. The jobs run concurrently, and each runner
    # parallelises inside its suite: pytest-xdist for pytest, bats --jobs for
    # bats (needs GNU parallel), one child process per file for the mod runner.
    # Git hands a hook run from a linked worktree GIT_DIR and GIT_INDEX_FILE,
    # which point at that worktree's repository. A suite's scratch repository
    # (git init, git commit, git config) would then write into the real one,
    # so every job unsets the variables that locate a repository.
    # https://git-scm.com/docs/githooks
    # https://pytest-xdist.readthedocs.io/en/stable/distribution.html
    # https://bats-core.readthedocs.io/en/stable/usage.html
    - name: tests
      group:
        parallel: true
        jobs:
          - name: test-rulesets
            glob:
              - "features/plugins/rulesets/**"
              - "pyproject.toml"
              - "uv.lock"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run --frozen pytest features/plugins/rulesets/tests -q -n auto
          - name: test-epistemic-marks
            glob:
              - "features/plugins/epistemic-marks/**"
              - "pyproject.toml"
              - "uv.lock"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run --frozen pytest features/plugins/epistemic-marks/tests -q -n auto
          - name: test-scripts
            glob:
              - "scripts/**"
              - ".claude-plugin/marketplace.json"
              - "settings.base.json"
              - "features/*/*/.claude-plugin/plugin.json"
              - "pyproject.toml"
              - "uv.lock"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run --frozen pytest scripts/tests scripts/arbiter/tests -q -n auto
          - name: test-warden
            glob: "features/plugins/warden/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR bats --jobs "$(getconf _NPROCESSORS_ONLN)" features/plugins/warden/tests
          - name: test-harness-config
            glob: "features/plugins/harness-config/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR bats --jobs "$(getconf _NPROCESSORS_ONLN)" features/plugins/harness-config/tests
          - name: test-context-gauge
            glob: "features/mods/context-gauge/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_WORK_TREE -u GIT_COMMON_DIR claude plugin test features/mods/context-gauge

pre-push:
  jobs:
    - name: shellcheck
      glob: "*.{sh,bash,bats}"
      run: shellcheck {push_files}

    - name: rulesets-check
      run: bash features/plugins/rulesets/hooks/with-python.sh features/plugins/rulesets/lib/rulesets/cli.py check --root rulesets
